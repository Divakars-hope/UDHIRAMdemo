<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rakt Sahayak — Emergency Blood Coordination</title>
<meta name="theme-color" content="#FFFFFF" />
<meta name="description" content="Emergency blood donor coordination — request a compatible donor with no sign-in required." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C1121F;
  --red-deep:#8B0000;
  --red-soft:#FBEAEB;
  --burgundy:#8B1620;
  --dark:#17140F;
  --ink:#FFFFFF;
  --ink-2:#FAF8F7;
  --ink-3:#F2EFED;
  --paper:#FFFFFF;
  --mist:#F5F3F2;
  --line:#E8E4E2;
  --grey:#B8B8B8;
  --text:#2A2523;
  --text-dim:#5C5450;
  --text-soft:#8B827D;
  --ok:#2E7D4F;
  --warn:#8A5A06;
  --font-display:'Fraunces', serif;
  --font-body:'IBM Plex Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --shell-max:1180px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--red);color:#fff;}

/* focus */
:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- layout shell ---------- */
.app-shell{min-height:100%; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:rgba(255,255,255,0.86); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 22px;
}
.topbar-inner{max-width:var(--shell-max); margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:600; font-size:19px; letter-spacing:0.2px;}
.brand-mark{width:26px;height:26px;flex:none;}
.brand small{display:block; font-family:var(--font-body); font-weight:500; font-size:10.5px; color:var(--text-soft); letter-spacing:0.4px;}
.nav-tabs{display:flex; gap:4px; align-items:center;}
.nav-tab{
  border:none; background:transparent; color:var(--text-dim); padding:8px 13px;
  border-radius:999px; font-size:13.5px; font-weight:500; cursor:pointer; transition:background .15s,color .15s;
  white-space:nowrap;
}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{background:var(--ink-3); color:var(--dark);}
.role-chip{
  display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border-radius:999px;
  background:var(--ink-2); border:1px solid rgba(15,13,12,0.08); font-size:12.5px; color:var(--text-dim);
}
.role-dot{width:8px;height:8px;border-radius:50%;background:var(--red); box-shadow:0 0 0 3px rgba(193,18,31,0.18);}
.role-switch-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:2px;padding:0;}

.container{max-width:var(--shell-max); margin:0 auto; padding:0 22px; width:100%;}
main{flex:1;}
.view{padding:36px 0 90px;}

/* ---------- typography ---------- */
h1,h2,h3{font-family:var(--font-display); margin:0; color:var(--dark); font-weight:600; letter-spacing:-0.01em;}
.h-hero{font-size:clamp(34px,5.4vw,58px); line-height:1.04; font-weight:600;}
.h-section{font-size:clamp(24px,3vw,32px); line-height:1.14;}
.h-card{font-size:19px; line-height:1.25;}
p{margin:0 0 12px; color:var(--text-dim); max-width:62ch;}
.lede{font-size:17px; color:var(--text-dim); max-width:52ch;}
.eyebrow{font-size:12.5px; color:var(--red); font-weight:600;}
.mono{font-family:var(--font-mono); font-size:12px; letter-spacing:0.2px;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:9px; border:1px solid transparent; padding:12px 20px; font-size:14.5px; font-weight:600;
  cursor:pointer; transition:transform .12s ease, background .15s, border-color .15s, opacity .15s;
  line-height:1;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--red); color:#fff;}
.btn-primary:hover{background:#a80f1a;}
.btn-primary:disabled{opacity:0.45; cursor:not-allowed;}
.btn-dark{background:var(--dark); color:#fff;}
.btn-dark:hover{background:#e9e4e3;}
.btn-outline{background:transparent; border-color:rgba(15,13,12,0.22); color:var(--dark);}
.btn-outline:hover{border-color:rgba(15,13,12,0.5);}
.btn-ghost{background:transparent; color:var(--text-dim); padding:10px 14px;}
.btn-ghost:hover{color:var(--dark);}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:7px;}
.btn-block{width:100%;}
.btn-danger-outline{background:transparent;border:1px solid rgba(193,18,31,0.45); color:var(--red-deep);}
.btn-danger-outline:hover{background:rgba(193,18,31,0.12);}

/* ---------- cards ---------- */
.card{
  background:var(--ink-2); border:1px solid rgba(15,13,12,0.07); border-radius:var(--radius-m);
  padding:20px;
}
.card-flat{background:var(--ink-2); border-radius:var(--radius-s); padding:16px; border:1px solid rgba(15,13,12,0.06);}
.panel{background:var(--ink-2); border:1px solid rgba(15,13,12,0.07); border-radius:var(--radius-l); padding:26px;}

/* ---------- badges / status ---------- */
.badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600;}
.badge-blood{background:var(--red); color:#fff; font-family:var(--font-mono); letter-spacing:0.3px;}
.badge-avail{background:rgba(46,125,79,0.16); color:var(--ok);}
.badge-unavail{background:rgba(15,13,12,0.08); color:var(--text-soft);}
.badge-critical{background:rgba(193,18,31,0.18); color:var(--red-deep);}
.badge-urgent{background:rgba(184,121,10,0.18); color:#8A5A06;}
.badge-normal{background:rgba(15,13,12,0.08); color:var(--text-dim);}
.badge-verified{background:rgba(15,13,12,0.08); color:#1E63B0;}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

/* ---------- landing ---------- */
.hero{
  padding:64px 0 42px; border-bottom:1px solid var(--line);
  background:
    radial-gradient(680px 420px at 82% -10%, rgba(193,18,31,0.05), transparent 60%),
    linear-gradient(180deg, var(--ink), var(--ink));
}
.hero-grid{display:grid; grid-template-columns:1.15fr 0.85fr; gap:48px; align-items:center;}
.hero-actions{display:flex; gap:12px; margin-top:26px; flex-wrap:wrap;}
.safety-strip{
  margin-top:26px; padding:13px 16px; border-radius:10px; background:rgba(15,13,12,0.04);
  border:1px solid rgba(15,13,12,0.08); font-size:13px; color:var(--text-dim); display:flex; gap:10px;
}
.safety-strip b{color:var(--dark); font-weight:600;}
.hero-card{
  border-radius:18px; padding:4px; background:linear-gradient(160deg, rgba(193,18,31,0.35), rgba(193,18,31,0.05));
}
.hero-card-inner{background:var(--ink-2); border-radius:15px; padding:22px;}
.match-preview-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(15,13,12,0.06);}
.match-preview-row:last-child{border-bottom:none;}

.feature-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:22px;}
.feature-card{padding:20px; border-radius:12px; background:var(--ink-2); border:1px solid rgba(15,13,12,0.06);}
.feature-card .h-card{margin-bottom:6px;}
.section{padding:52px 0; border-bottom:1px solid rgba(15,13,12,0.06);}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px; flex-wrap:wrap;}

/* ---------- role select ---------- */
.role-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; max-width:760px;}
.role-card{
  text-align:left; padding:26px; border-radius:16px; background:var(--ink-2); border:1px solid rgba(15,13,12,0.08);
  cursor:pointer; transition:border-color .15s, transform .15s; color:inherit;
}
.role-card:hover{border-color:rgba(193,18,31,0.5); transform:translateY(-2px);}
.role-icon{font-size:26px; margin-bottom:14px;}

/* ---------- demo login ---------- */
.login-wrap{max-width:420px; margin:0 auto;}
.login-field{margin-bottom:14px;}
.login-field label{display:block; font-size:12.5px; color:var(--text-soft); margin-bottom:6px; font-weight:500;}
.login-field input{
  width:100%; background:var(--ink-3); border:1px solid rgba(15,13,12,0.1); border-radius:8px;
  padding:11px 12px; color:var(--dark); font-size:14px;
}
.login-field input:focus{border-color:var(--red);}
.demo-creds{
  margin-top:18px; padding:14px 16px; border-radius:10px; background:rgba(15,13,12,0.03);
  border:1px dashed rgba(15,13,12,0.15);
}
.demo-creds-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13px;}
.demo-creds-row + .demo-creds-row{border-top:1px solid rgba(15,13,12,0.06);}
.copy-btn{background:none;border:none;color:var(--text-soft);cursor:pointer;font-size:11.5px;text-decoration:underline;padding:0;}
.copy-btn:hover{color:var(--dark);}

/* ---------- prototype controls ---------- */
.demo-panel{border:1px solid rgba(193,18,31,0.3); border-radius:12px; background:rgba(193,18,31,0.06); overflow:hidden;}
.demo-panel-head{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; cursor:pointer;}
.demo-panel-body{padding:0 16px 16px; display:flex; flex-wrap:wrap; gap:8px;}
.demo-panel.collapsed .demo-panel-body{display:none;}
.chevron{transition:transform .15s;}
.demo-panel.collapsed .chevron{transform:rotate(-90deg);}

/* ---------- forms ---------- */
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:500; color:var(--text-dim); margin-bottom:7px;}
.field .hint{font-size:12px; color:var(--text-soft); margin-top:5px;}
select, .input{
  width:100%; background:var(--ink-3); border:1px solid rgba(15,13,12,0.1); border-radius:8px;
  padding:11px 12px; color:var(--dark); font-size:14px;
}
.pill-group{display:flex; flex-wrap:wrap; gap:8px;}
.pill-opt{
  border:1px solid rgba(15,13,12,0.12); background:var(--ink-3); color:var(--text-dim);
  padding:9px 15px; border-radius:8px; cursor:pointer; font-size:13.5px; font-weight:500; transition:all .12s;
}
.pill-opt.selected{border-color:var(--red); background:rgba(193,18,31,0.18); color:var(--dark);}
.bg-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.bg-opt{
  border:1px solid rgba(15,13,12,0.12); background:var(--ink-3); color:var(--dark); font-family:var(--font-mono); font-weight:600;
  padding:12px; border-radius:8px; cursor:pointer; text-align:center; font-size:14px; transition:all .12s;
}
.bg-opt.selected{border-color:var(--red); background:var(--red);}
.step-track{display:flex; gap:6px; margin-bottom:26px;}
.step-track span{flex:1; height:3px; border-radius:2px; background:rgba(15,13,12,0.1);}
.step-track span.done{background:var(--red);}

/* ---------- donor list ---------- */
.filters-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; padding:14px; background:var(--ink-2); border-radius:10px; border:1px solid rgba(15,13,12,0.06);}
.filters-bar select{width:auto; padding:8px 10px; font-size:13px;}
.result-count{font-size:13px; color:var(--text-soft); margin:2px 0 16px;}
.donor-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
.donor-card{background:var(--ink-2); border:1px solid rgba(15,13,12,0.07); border-radius:12px; padding:18px;}
.donor-card.rank-1{border-color:rgba(193,18,31,0.5); box-shadow:0 0 0 1px rgba(193,18,31,0.15) inset;}
.donor-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;}
.donor-alias{font-weight:600; color:var(--dark); font-size:14.5px;}
.donor-meta{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--text-soft); margin-bottom:10px;}
.donor-meta b{color:var(--text-dim); font-weight:600;}
.why-match{list-style:none; margin:10px 0 14px; padding:0; font-size:12.5px; color:var(--text-dim); display:flex; flex-direction:column; gap:4px;}
.why-match li::before{content:"✓ "; color:var(--ok); font-weight:700;}
.donor-actions{display:flex; gap:8px;}
.excluded-list{margin-top:26px;}
.excluded-row{display:flex; justify-content:space-between; padding:10px 14px; border-radius:8px; background:rgba(15,13,12,0.02); font-size:13px; color:var(--text-soft); margin-bottom:6px;}
.excluded-row b{color:var(--text-dim);}

/* ---------- empty / loading ---------- */
.empty-state{text-align:center; padding:50px 20px; color:var(--text-soft);}
.empty-state .h-card{color:var(--dark); margin-bottom:6px;}
.loading-lines{display:flex; flex-direction:column; gap:10px; align-items:center; padding:50px 20px;}
.loading-line{font-size:13.5px; color:var(--text-dim); opacity:0; animation:fadeIn .4s forwards;}
.loading-line:nth-child(1){animation-delay:0s;}
.loading-line:nth-child(2){animation-delay:.5s;}
.loading-line:nth-child(3){animation-delay:1s;}
.loading-line:nth-child(4){animation-delay:1.5s;}
@keyframes fadeIn{to{opacity:1;}}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid rgba(15,13,12,0.15);border-top-color:var(--red);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- dashboards ---------- */
.dash-grid{display:grid; grid-template-columns:2fr 1fr; gap:20px; align-items:start;}
.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0;}
.stat-box{background:var(--ink-3); border-radius:10px; padding:14px 16px;}
.stat-box .num{font-family:var(--font-display); font-size:24px; color:var(--dark); font-weight:600;}
.stat-box .lbl{font-size:11.5px; color:var(--text-soft); margin-top:2px;}
.credit-hero{background:linear-gradient(135deg, var(--red-deep), var(--burgundy)); border-radius:14px; padding:22px; border:1px solid rgba(193,18,31,0.3);}
.credit-num{font-family:var(--font-display); font-size:40px; font-weight:600; color:#fff;}
.progress-track{height:8px; border-radius:5px; background:rgba(15,13,12,0.1); overflow:hidden; margin:10px 0;}
.progress-fill{height:100%; background:var(--red); border-radius:5px; transition:width .4s ease;}
.timeline{list-style:none; margin:0; padding:0;}
.timeline li{display:flex; gap:12px; padding:10px 0; font-size:13.5px;}
.timeline .tl-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none;}
.timeline .done .tl-dot{background:var(--ok);}
.timeline .pending .tl-dot{background:rgba(15,13,12,0.2);}
.timeline .done span{color:var(--dark);}
.timeline .pending span{color:var(--text-soft);}
.credit-tx{display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px solid rgba(15,13,12,0.05);}
.credit-tx b{color:var(--ok);}

/* ---------- chat ---------- */
.chat-box{background:var(--ink-2); border-radius:12px; border:1px solid rgba(15,13,12,0.07); display:flex; flex-direction:column; height:420px;}
.chat-log{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;}
.chat-msg{max-width:75%; padding:9px 13px; border-radius:12px; font-size:13.5px; line-height:1.4;}
.chat-msg.me{align-self:flex-end; background:var(--red); color:#fff; border-bottom-right-radius:3px;}
.chat-msg.them{align-self:flex-start; background:var(--ink-3); color:var(--text); border-bottom-left-radius:3px;}
.chat-msg.sys{align-self:center; background:transparent; color:var(--text-soft); font-size:11.5px; text-align:center; max-width:100%;}
.chat-input-row{display:flex; gap:8px; padding:12px; border-top:1px solid rgba(15,13,12,0.07);}
.chat-input-row input{flex:1;}

/* ---------- notifications ---------- */
.notif-item{display:flex; gap:12px; padding:14px; border-radius:10px; background:var(--ink-2); border:1px solid rgba(15,13,12,0.06); margin-bottom:8px;}
.notif-icon{font-size:18px;}
.notif-item.unread{border-color:rgba(193,18,31,0.35);}
.notif-time{font-size:11px; color:var(--text-soft); margin-top:2px;}

/* ---------- toast ---------- */
#toast-root{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; width:min(92vw,420px);}
.toast{background:var(--ink-2); border:1px solid rgba(15,13,12,0.12); border-radius:10px; padding:12px 16px; font-size:13.5px; box-shadow:0 10px 30px rgba(20,16,14,0.10); animation:toastIn .25s ease;}
.toast.success{border-left:3px solid var(--ok);}
.toast.error{border-left:3px solid var(--red);}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- misc ---------- */
.divider{height:1px; background:rgba(15,13,12,0.07); margin:20px 0;}
.tag-row{display:flex; gap:8px; flex-wrap:wrap;}
.small-link{font-size:12.5px; color:var(--text-soft); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; text-underline-offset:2px;}
.small-link:hover{color:var(--dark);}
.level-badge{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; background:rgba(15,13,12,0.08); font-size:12.5px; font-weight:600; color:var(--dark);}
.appreciation{text-align:center; padding:50px 20px;}
.appreciation .big{font-family:var(--font-display); font-size:clamp(28px,4vw,40px); color:var(--dark); margin-bottom:10px;}
.upload-box{border:1.5px dashed rgba(15,13,12,0.18); border-radius:10px; padding:26px; text-align:center; color:var(--text-soft); cursor:pointer; font-size:13.5px;}
.upload-box:hover{border-color:var(--red);}
.compat-table{width:100%; border-collapse:collapse; font-size:13px;}
.compat-table th,.compat-table td{border:1px solid rgba(15,13,12,0.08); padding:8px 10px; text-align:center;}
.compat-table th{background:var(--ink-3); color:var(--text-dim); font-weight:600;}
.compat-table td.yes{color:var(--ok); font-weight:700;}
.compat-table td.no{color:var(--text-soft);}
.footer{padding:30px 0 50px; text-align:center; color:var(--text-soft); font-size:12.5px;}
.star-row{display:flex; gap:6px; font-size:24px;}
.star{cursor:pointer; color:rgba(15,13,12,0.18);}
.star.filled{color:var(--red);}
textarea.input{resize:vertical; min-height:80px; font-family:inherit;}

@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr;}
  .feature-grid{grid-template-columns:1fr 1fr;}
  .role-grid{grid-template-columns:1fr;}
  .donor-grid{grid-template-columns:1fr;}
  .dash-grid{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:1fr 1fr;}
  .nav-tabs{display:none;}
}
@media (max-width:520px){
  .feature-grid{grid-template-columns:1fr;}
  .topbar{padding:12px 16px;}
  .container{padding:0 16px;}
  .bg-grid{grid-template-columns:repeat(4,1fr);}
}

/* wide content never breaks the body scroll */
.scroll-x{overflow-x:auto;}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   Rakt Sahayak — Emergency Blood Coordination
   Client-side prototype. No backend. Synthetic data. Simulated payments.
   ===================================================================== */

var STORAGE_KEY = 'rakt_sahayak_state_v3';

var BLOOD_TYPES = ['O-','O+','A-','A+','B-','B+','AB-','AB+'];
var ZONES = ['Zone A','Zone B','Zone C','Zone D','Zone E'];

/* donor blood type -> set of recipient types it can safely be a *candidate* for
   (standard ABO/Rh red-cell donor compatibility, preliminary candidate filter only) */
var DONOR_COMPAT = {
  'O-':  ['O-','O+','A-','A+','B-','B+','AB-','AB+'],
  'O+':  ['O+','A+','B+','AB+'],
  'A-':  ['A-','A+','AB-','AB+'],
  'A+':  ['A+','AB+'],
  'B-':  ['B-','B+','AB-','AB+'],
  'B+':  ['B+','AB+'],
  'AB-': ['AB-','AB+'],
  'AB+': ['AB+']
};

function isCompatibleCandidate(donorType, recipientType){
  return DONOR_COMPAT[donorType] && DONOR_COMPAT[donorType].indexOf(recipientType) !== -1;
}

/* zone base distance bands (km) — synthetic, approximate only, never exact coordinates */
var ZONE_BASE_KM = {'Zone A':1.6,'Zone B':4.8,'Zone C':7.9,'Zone D':11.2,'Zone E':15.4};

function seededOffset(id){
  var h = 0;
  for (var i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; }
  return (h % 140) / 100; // 0.00 - 1.39 km jitter, deterministic per id
}

function approxDistanceKm(donor){
  return Math.round((ZONE_BASE_KM[donor.zone] + seededOffset(donor.id)) * 10) / 10;
}

function levelForCredits(c){
  if (c >= 500) return 'Life Champion';
  if (c >= 300) return 'Life Supporter';
  if (c >= 100) return 'Community Helper';
  return 'First Responder';
}
function nextLevelThreshold(c){
  if (c < 100) return 100;
  if (c < 300) return 300;
  if (c < 500) return 500;
  return null;
}

function daysAgoFromToday(days){
  var d = new Date();
  d.setDate(d.getDate() - days);
  return d;
}
function fmtDate(d){
  if (typeof d === 'string') d = new Date(d);
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
}
function daysBetweenToday(dateVal){
  var d = new Date(dateVal);
  var now = new Date();
  return Math.floor((now - d) / (1000*60*60*24));
}
function uid(prefix){
  return prefix + '_' + Math.random().toString(36).slice(2,9);
}

/* ---------------------------------------------------------------------
   MATCHING ENGINE — deterministic, explainable, no black-box scoring
   --------------------------------------------------------------------- */
function getPotentialDonors(request, donors){
  var matched = [];
  var excluded = [];

  donors.forEach(function(d){
    var dist = approxDistanceKm(d);
    var compatible = isCompatibleCandidate(d.bloodType, request.bloodType);

    if (!compatible){
      excluded.push({ donor:d, reason:'Incompatible ABO/Rh combination for this request' });
      return;
    }
    if (!d.available){
      excluded.push({ donor:d, reason:'Currently marked unavailable' });
      return;
    }
    var freshnessDays = daysBetweenToday(d.lastAvailabilityUpdate);
    var reasons = ['Potential ABO/Rh compatibility', 'Currently available'];
    if (d.zone === request.zone) reasons.push('Same zone as request');
    reasons.push('Approximately ' + dist + ' km away');
    if (freshnessDays <= 3) reasons.push('Availability recently updated');

    matched.push({
      donor:d,
      distance:dist,
      sameZone: d.zone === request.zone,
      freshnessDays: freshnessDays,
      acceptRate: (d.responseHistory.accepted) / Math.max(1,(d.responseHistory.accepted + d.responseHistory.declined)),
      reasons: reasons
    });
  });

  matched.sort(function(a,b){
    if (a.sameZone !== b.sameZone) return a.sameZone ? -1 : 1;
    if (a.distance !== b.distance) return a.distance - b.distance;
    if (a.freshnessDays !== b.freshnessDays) return a.freshnessDays - b.freshnessDays;
    if (b.acceptRate !== a.acceptRate) return b.acceptRate - a.acceptRate;
    return b.donor.donationCount - a.donor.donationCount;
  });

  matched.forEach(function(m, i){ m.rank = i+1; });

  return { matches: matched, excluded: excluded };
}

function findDonor(id){ return STATE.donors.find(function(d){ return d.id === id; }); }

function activeRequestForRole(){
  // "receiver" demo owns whichever request was created most recently
  if (!STATE.requests.length) return null;
  return STATE.requests[STATE.requests.length - 1];
}

function requestForDonor(donorId){
  // most relevant request currently pointed at this donor (requested/accepted/etc.)
  var candidates = STATE.requests.filter(function(r){
    return r.donorId === donorId;
  });
  return candidates.length ? candidates[candidates.length-1] : null;
}

   --------------------------------------------------------------------- */
function createRequest(draft){
  var req = {
    id: uid('req'),
    bloodType: draft.bloodType,
    units: draft.units,
    zone: draft.zone,
    priority: draft.priority,
    type: draft.type, // 'emergency' | 'normal'
    status: 'REQUESTED',
    donorId: null,
    emergencyVerification: draft.type === 'emergency' ? 'PENDING' : null,
    proofStatus: null,
    refundStatus: null,
    createdAt: new Date().toISOString(),
    timeline: [
      { label:'Request created', done:true }
    ]
  };
  STATE.requests.push(req);
  STATE.chats[req.id] = [
    { sys:true, text:'Request created. Matching engine ready to run.', ts:new Date().toISOString() }
  ];
  return req;
}

function requestDonor(requestId, donorId){
  var req = findRequest(requestId);
  if (!req) return;
  req.donorId = donorId;
  req.status = 'PENDING';
  req.timeline.push({ label:'Potential donor identified', done:true });
  req.timeline.push({ label:'Donor accepted', done:false });
  var donor = findDonor(donorId);
  pushNotification('New donor request sent', 'You requested ' + donor.alias + ' for your ' + req.bloodType + ' request.', '📨');
  STATE.chats[req.id].push({ sys:true, text: donor.alias + ' has been notified of your request.', ts:new Date().toISOString() });
}

function donorRespond(requestId, accept){
  var req = findRequest(requestId);
  if (!req) return;
  var donor = findDonor(req.donorId);
  if (accept){
    req.status = 'ACCEPTED';
    req.timeline.forEach(function(t){ if (t.label==='Donor accepted') t.done = true; });
    req.timeline.push({ label:'Communication opened', done:true });
    donor.responseHistory.accepted++;
    STATE.chats[req.id].push({ sys:true, text: donor.alias + ' accepted the request. Approximate location sharing enabled.', ts:new Date().toISOString() });
    pushNotification('Donor accepted', donor.alias + ' has accepted your request.', '✅');
  } else {
    req.status = 'DECLINED';
    donor.responseHistory.declined++;
    STATE.chats[req.id].push({ sys:true, text: donor.alias + ' declined the request.', ts:new Date().toISOString() });
    pushNotification('Donor declined', donor.alias + ' is unable to help with this request.', '⚠️');
  }
}

function completeDonation(requestId){
  var req = findRequest(requestId);
  if (!req) return;
  var donor = findDonor(req.donorId);
  req.status = 'COMPLETED';
  req.timeline.push({ label:'Donation completed', done:true });
  req.timeline.push({ label:'Request completed', done:true });
  donor.donationCount += 1;
  donor.lastDonationDate = new Date().toISOString();
  donor.donationHistory.unshift(new Date().toISOString());
  var bonus = req.type === 'emergency' ? 25 : 0;
  var verifiedBonus = 10;
  var gained = 100 + bonus + verifiedBonus;
  donor.healthCredits += gained;
  donor.creditHistory.unshift({ label:'Donation completed', amount:100 });
  if (bonus) donor.creditHistory.unshift({ label:'Emergency contribution bonus', amount:bonus });
  donor.creditHistory.unshift({ label:'Verified donation record', amount:verifiedBonus });
  pushNotification('Donation completed', 'Donation #' + donor.donationCount + ' has been recorded for ' + donor.alias + '.', '🩸');
  pushNotification('Recognition', '+' + gained + ' HEALTH Credits added.', '🏅');
  STATE.chats[req.id].push({ sys:true, text:'Donation marked as completed. Thank you.', ts:new Date().toISOString() });
}

/* ---------------------------------------------------------------------
   HEALTH CREDITS -> HEALTH EXPENSE DISCOUNT REDEMPTION
   1 HEALTH Credit = ₹1 of simulated discount toward a verified health
   expense (pharmacy, diagnostic test or clinic consultation). This is a
   client-side prototype simulation — no real payment gateway or partner
   network is contacted.
   --------------------------------------------------------------------- */
function generateVoucherCode(){
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = 'RS-';
  for (var i=0;i<7;i++){
    if (i===3) code += '-';
    code += chars[Math.floor(Math.random()*chars.length)];
  }
  return code;
}
var MIN_REDEMPTION = 20;
function claimHealthCredits(donorId, amount){
  var d = findDonor(donorId);
  if (!d) return;
  amount = Math.floor(Number(amount));
  if (!amount || amount <= 0){
    toast('Enter a valid number of credits to redeem.', 'error');
    return;
  }
  if (amount < MIN_REDEMPTION){
    toast('Minimum redemption is ' + MIN_REDEMPTION + ' HEALTH Credits.', 'error');
    return;
  }
  if (amount > d.healthCredits){
    toast('You only have ' + d.healthCredits + ' HEALTH Credits available.', 'error');
    return;
  }
  d.healthCredits -= amount;
  var code = generateVoucherCode();
  var voucher = {
    code: code,
    amount: amount,
    ts: new Date().toISOString(),
    status: 'ISSUED'
  };
  d.redemptions.unshift(voucher);
  d.creditHistory.unshift({ label:'Redeemed for health expense discount', amount: -amount });
  pushNotification('Discount voucher issued', '₹' + amount + ' health expense discount voucher ' + code + ' is ready to use.', '💳');
  saveState();
  toast('Voucher ' + code + ' issued — ₹' + amount + ' off your next health expense.', 'success');
  render();
}
function claimCustomAmount(donorId){
  var input = document.getElementById('redeemAmount');
  var val = input ? input.value : '';
  claimHealthCredits(donorId, val);
}
function copyVoucherCode(code){
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code);
      toast('Voucher code copied.', 'success');
    } else {
      toast('Voucher code: ' + code, 'success');
    }
  }catch(e){
    toast('Voucher code: ' + code, 'success');
  }
}

function toast(msg, kind){
  var root = document.getElementById('toast-root');
  if (!root) return;
  var el = document.createElement('div');
  el.className = 'toast ' + (kind || 'success');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3400);
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function startNewRequest(){
  STATE.requestDraft = { step:1, bloodType:null, units:1, zone:null, priority:'Urgent', type:null };
  setView('request-new');
}
function draftSet(key, val){
  if (!STATE.requestDraft) STATE.requestDraft = { step:1, units:1, priority:'Urgent' };
  STATE.requestDraft[key] = val;
  saveState();
  render();
}
function draftGoStep(n){
  var d = STATE.requestDraft;
  if (n === 2 && !d.bloodType){ toast('Select a blood group first.', 'error'); return; }
  if (n === 3 && !d.zone){ toast('Select an approximate zone.', 'error'); return; }
  if (n === 4 && !d.type){ toast('Choose emergency or non-emergency.', 'error'); return; }
  d.step = n;
  saveState(); render();
}
function draftSubmit(){
  var d = STATE.requestDraft;
  if (!d.bloodType || !d.zone || !d.type){ toast('Please complete all steps before submitting.', 'error'); return; }
  var req = createRequest(d);
  STATE.requestDraft = null;
  saveState();
  setView('request-matching', { requestId: req.id });
  toast('Request created.', 'success');
}

/* ---------------------------------------------------------------------
   VIEW: REQUEST MATCHING (emergency verification gate + matching engine)
   --------------------------------------------------------------------- */
function runMatching(requestId){
  STATE.matchLoading = requestId;
  saveState(); render();
  setTimeout(function(){
    var req = findRequest(requestId);
    var result = getPotentialDonors(req, STATE.donors);
    STATE.lastMatchRun = { requestId: requestId, matches: result.matches, excluded: result.excluded };
    STATE.matchLoading = null;
    STATE.matchFilters = { zone:'', availability:'', minDonations:0 };
    saveState(); render();
  }, 1500);
}
function resetMatchFilters(){
  STATE.matchFilters = { zone:'', availability:'', minDonations:0 };
  render();
}
function setMatchFilter(key, val){
  if (!STATE.matchFilters) STATE.matchFilters = { zone:'', availability:'', minDonations:0 };
  STATE.matchFilters[key] = val;
  render();
}

function viewRequestMatching(){
  var requestId = STATE.viewParams.requestId;
  var req = findRequest(requestId);
  if (!req){
    return '<div class="container view"><div class="empty-state"><div class="h-card">Request not found</div><p>It may have been reset. Start a new request.</p><button class="btn btn-primary" onclick="startNewRequest()">New request</button></div></div>';
  }

  var head = '<div class="container view">' +
    '<span class="eyebrow">' + req.priority + ' · ' + req.type.toUpperCase() + '</span>' +
    '<h2 class="h-section" style="margin:8px 0 6px;">' + req.bloodType + ' request · ' + req.units + ' unit(s) · ' + req.zone + '</h2>' +
    safetyStrip();

  // Emergency gate
  if (req.type === 'emergency' && req.emergencyVerification !== 'SUCCESS'){
    return head + '<div class="panel" style="max-width:520px; margin-top:22px;">' +
      '<div class="eyebrow" style="margin-bottom:8px;">Emergency verification deposit</div>' +
      '<h3 class="h-card" style="margin-bottom:8px;">₹100 simulated deposit</h3>' +
      '<p>This prototype simulates a refundable verification deposit intended to activate an accelerated contact workflow. No real payment is processed.</p>' +
      '<button class="btn btn-primary" onclick="simulateEmergencyVerification(\''+req.id+'\'); render();">Simulate ₹100 verification</button>' +
    '</div></div>';
  }

  var afterVerification = req.type === 'emergency' ?
    '<div class="badge badge-verified" style="margin:14px 0;">🚨 Emergency coordination active — simulated verification succeeded</div>' : '';

  var matchArea = '';
  if (STATE.matchLoading === req.id){
    matchArea = '<div class="panel"><div class="loading-lines">' +
      '<div class="spinner"></div>' +
      '<div class="loading-line">Checking compatibility…</div>' +
      '<div class="loading-line">Filtering availability…</div>' +
      '<div class="loading-line">Calculating approximate proximity…</div>' +
      '<div class="loading-line">Ranking potential matches…</div>' +
    '</div></div>';
  } else if (!STATE.lastMatchRun || STATE.lastMatchRun.requestId !== req.id){
    matchArea = '<div class="panel" style="text-align:center; padding:40px 20px;">' +
      '<p>Run the matching engine to identify potential donor candidates for this request.</p>' +
      '<button class="btn btn-primary" onclick="runMatching(\''+req.id+'\')">Run matching engine</button>' +
    '</div>';
  } else {
    matchArea = renderMatchResults(req);
  }

  return head + afterVerification + matchArea + '</div>';
}

function renderMatchResults(req){
  var run = STATE.lastMatchRun;
  var filters = STATE.matchFilters || { zone:'', availability:'', minDonations:0 };
  var visible = run.matches.filter(function(m){
    if (filters.zone && m.donor.zone !== filters.zone) return false;
    if (filters.minDonations && m.donor.donationCount < filters.minDonations) return false;
    return true;
  });

  var filterBar = '<div class="filters-bar">' +
    '<select onchange="setMatchFilter(\'zone\', this.value)">' +
      '<option value="">All zones</option>' +
      ZONES.map(function(z){ return '<option value="'+z+'"'+(filters.zone===z?' selected':'')+'>'+z+'</option>'; }).join('') +
    '</select>' +
    '<select onchange="setMatchFilter(\'minDonations\', parseInt(this.value)||0)">' +
      '<option value="0">Any donation count</option>' +
      '<option value="1"'+(filters.minDonations===1?' selected':'')+'>1+ donations</option>' +
      '<option value="3"'+(filters.minDonations===3?' selected':'')+'>3+ donations</option>' +
      '<option value="5"'+(filters.minDonations===5?' selected':'')+'>5+ donations</option>' +
    '</select>' +
    '<button class="btn btn-ghost btn-sm" onclick="resetMatchFilters()">Reset filters</button>' +
    '<button class="btn btn-ghost btn-sm" onclick="runMatching(\''+req.id+'\')">Re-run matching</button>' +
  '</div>';

  var cards = visible.length ? visible.map(function(m){ return donorMatchCard(m, req); }).join('') :
    '<div class="empty-state"><div class="h-card">No potential donors found.</div><p>Try expanding the approximate zone or reviewing the request details.</p></div>';

  var excluded = run.excluded.length ? (
    '<div class="excluded-list"><h3 class="h-card" style="margin-bottom:10px;">Excluded from potential matches (' + run.excluded.length + ')</h3>' +
    run.excluded.map(function(x){
      return '<div class="excluded-row"><span><b>' + x.donor.alias + '</b> · ' + x.donor.bloodType + '</span><span>' + x.reason + '</span></div>';
    }).join('') + '</div>'
  ) : '';

  return filterBar +
    '<div class="result-count">' + visible.length + ' potential donor' + (visible.length===1?'':'s') + ' found</div>' +
    '<div class="donor-grid">' + cards + '</div>' +
    excluded;
}

function donorMatchCard(m, req){
  var d = m.donor;
  var alreadyRequested = req.donorId === d.id;
  return '<div class="donor-card' + (m.rank===1?' rank-1':'') + '">' +
    '<div class="donor-top">' +
      '<div><div class="donor-alias">' + d.alias + '</div>' +
        '<div class="donor-meta"><span class="badge badge-blood">' + d.bloodType + '</span><span class="badge badge-avail">Available</span></div></div>' +
      (m.rank===1 ? '<span class="badge badge-verified">Top match</span>' : '<span style="color:var(--text-soft); font-size:12px;">#'+m.rank+'</span>') +
    '</div>' +
    '<div class="donor-meta"><span><b>' + d.zone + '</b></span><span>~' + m.distance + ' km</span><span>' + d.donationCount + ' donations</span><span>' + d.healthCredits + ' credits</span></div>' +
    '<ul class="why-match">' + m.reasons.map(function(r){ return '<li>' + r + '</li>'; }).join('') + '</ul>' +
    '<div class="donor-actions">' +
      '<button class="btn btn-outline btn-sm" onclick="go(\'donor-profile\',{donorId:\''+d.id+'\',requestId:\''+req.id+'\'})">View profile</button>' +
      (alreadyRequested ?
        '<button class="btn btn-primary btn-sm" disabled>Requested</button>' :
        '<button class="btn btn-primary btn-sm" onclick="requestDonorAndRefresh(\''+req.id+'\',\''+d.id+'\')">Request donor</button>') +
    '</div>' +
  '</div>';
}
function requestDonorAndRefresh(reqId, donorId){
  requestDonor(reqId, donorId);
  saveState();
  toast('Donor requested. They will appear on your dashboard once they respond.', 'success');
  go('receiver-dashboard');
}

/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */
function statusBadgeClass(status){
  if (status==='COMPLETED') return 'badge-avail';
  if (status==='DECLINED' || status==='CANCELLED') return 'badge-unavail';
  if (status==='ACCEPTED') return 'badge-verified';
  return 'badge-urgent';
}

function viewReceiverDashboard(){

            '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">' +
              '<div><div class="eyebrow">' + req.priority + ' · ' + req.type.toUpperCase() + '</div>' +
                '<div class="h-card" style="margin-top:4px;">' + req.bloodType + ' · ' + req.units + ' unit(s) · ' + req.zone + '</div></div>' +
              '<span class="badge ' + statusBadgeClass(req.status) + '">' + req.status + '</span>' +
            '</div>' +
            '<div class="divider"></div>' +
            '<ul class="timeline">' + req.timeline.map(function(t){
              return '<li class="' + (t.done?'done':'pending') + '"><span class="tl-dot"></span><span>' + t.label + '</span></li>';
            }).join('') + '</ul>' +
            '<div class="tag-row" style="margin-top:14px;">' +
              (req.status === 'REQUESTED' ? '<button class="btn btn-primary btn-sm" onclick="go(\'request-matching\',{requestId:\''+req.id+'\'})">Find potential donors</button>' : '') +
              (req.status === 'PENDING' ? '<button class="btn btn-outline btn-sm" onclick="go(\'request-matching\',{requestId:\''+req.id+'\'})">View matching results</button>' : '') +
              (donor ? '<button class="btn btn-outline btn-sm" onclick="go(\'chat\',{requestId:\''+req.id+'\'})">Open chat</button>' : '') +
              (donor ? '<button class="btn btn-ghost btn-sm" onclick="go(\'donor-profile\',{donorId:\''+donor.id+'\',requestId:\''+req.id+'\'})">View donor profile</button>' : '') +
            '</div>' +
          '</div>' +
          (req.status === 'COMPLETED' ? proofCashbackPanel(req) : '') +
          (req.status === 'COMPLETED' ? feedbackInline(req.id, 'receiver') : '') +
        '</div>' +

        '</div>' +

  }

  var historyRows = reqs.length ? reqs.slice().reverse().map(function(r){
    return '<div class="excluded-row" style="cursor:pointer;" onclick="go(\'receiver-dashboard\',{requestId:\''+r.id+'\'})">' +
      '<span><b>' + r.bloodType + '</b> · ' + r.zone + ' · ' + r.priority + '</span>' +
      '<span class="badge ' + statusBadgeClass(r.status) + '" style="margin-left:8px;">' + r.status + '</span></div>';
  }).join('') : '';

  return '<div class="container view">' +
    '<div class="section-head"><div><span class="eyebrow">Receiver dashboard</span><h2 class="h-section" style="margin-top:6px;">Your coordination requests</h2></div>' +
      '<button class="btn btn-primary btn-sm" onclick="startNewRequest()">+ New request</button></div>' +

function donorSummaryCard(d){
  var level = levelForCredits(d.healthCredits);

function proofCashbackPanel(req){
  if (req.type !== 'emergency') return '';
  var status = req.proofStatus;
  var body = '';
  if (!status){
    body = '<div class="upload-box" onclick="submitProofAndRender(\''+req.id+'\')">📎 Tap to simulate uploading completion proof (blood donation record, blood-bank receipt, or hospital document)</div>' +
      '<p class="hint">Identity proof alone does not establish that a donation occurred.</p>';

    body = '<div class="badge badge-urgent">PENDING</div><p style="margin-top:10px;">Your proof has been submitted for prototype verification.</p>' +

function submitProofAndRender(reqId){

function feedbackInline(requestId, role){

             '<p class="hint">' + (intervalPct>=100 ? 'Approaching the next donation reminder window.' : 'Reminder window in ' + Math.max(0,reminderWindow-lastDonationDaysAgo) + ' more day(s).') + '</p>') :

function presetRedeemBtn(d, amount){

function toggleAvailabilityAndRender(id){
  var d = findDonor(id);
  d.available = !d.available;
  d.lastAvailabilityUpdate = new Date().toISOString();
  saveState();
  pushNotification('Availability updated', 'You are currently marked as ' + (d.available?'AVAILABLE':'UNAVAILABLE') + '.', d.available?'🟢':'⚪');

function donorRespondAndRender(reqId, accept){
  donorRespond(reqId, accept);
  saveState(); render();
}
function completeDonationAndRender(reqId){
  var req = findRequest(reqId);
  var donor = findDonor(req.donorId);
  completeDonation(reqId);
  var messages = [
    'You showed up when someone needed help.',
    'Your willingness to donate can make a meaningful difference.',
    'Thank you for being there when it mattered.',
    'One donation. One act of kindness. One more reason to be proud.'
  ];
  STATE.appreciation = {
    donorId: donor.id,
    donationCount: donor.donationCount,
    credits: 100 + (req.type==='emergency'?25:0) + 10,
    message: messages[Math.floor(Math.random()*messages.length)]
  };
  saveState(); render();
}

/* ---------------------------------------------------------------------
   VIEW: CHAT (simulated, local only)
   --------------------------------------------------------------------- */
var AUTO_REPLY_POOL = ['Yes, I can help.', 'I\'m happy to help.', 'On my way shortly.', 'Thank you so much.', 'Let\'s coordinate a time.'];

function viewChat(){
  var reqId = STATE.viewParams.requestId;
  var req = findRequest(reqId);
  if (!req) return '<div class="container view"><div class="empty-state">Request not found.</div></div>';
  var donor = req.donorId ? findDonor(req.donorId) : null;
  var msgs = STATE.chats[reqId] || [];
  var role = STATE.session.role;

  var log = msgs.map(function(m){
    if (m.sys) return '<div class="chat-msg sys">' + esc(m.text) + '</div>';
    var mine = m.from === role;
    return '<div class="chat-msg ' + (mine?'me':'them') + '">' + esc(m.text) + '</div>';
  }).join('');

  return '<div class="container view"><div style="max-width:560px;">' +
    '<span class="eyebrow">Prototype simulated chat</span>' +
    '<h2 class="h-section" style="margin:8px 0 6px;">' + (donor?donor.alias:'Donor') + '</h2>' +
    '<p class="hint" style="margin-bottom:14px;">Approximate location sharing only — no exact address is ever exchanged.</p>' +
    '<div class="chat-box">' +
      '<div class="chat-log" id="chatLog">' + (log || '<div class="chat-msg sys">No messages yet.</div>') + '</div>' +
      '<div class="chat-input-row"><input class="input" id="chatInput" placeholder="Type a message…" onkeydown="if(event.key===\'Enter\')sendChatAndRender(\''+reqId+'\')"/>' +
      '<button class="btn btn-primary btn-sm" onclick="sendChatAndRender(\''+reqId+'\')">Send</button></div>' +
    '</div>' +
  '</div></div>';
}
function sendChatAndRender(reqId){
  var input = document.getElementById('chatInput');
  var text = (input.value || '').trim();
  if (!text) return;
  var role = STATE.session.role;
  sendChatMessage(reqId, role, text);
  saveState(); render();
  var log = document.getElementById('chatLog');
  if (log) log.scrollTop = log.scrollHeight;

  var req = findRequest(reqId);
  if (req && req.status === 'ACCEPTED'){
    setTimeout(function(){
      var otherRole = role === 'receiver' ? 'donor' : 'receiver';
      var reply = AUTO_REPLY_POOL[Math.floor(Math.random()*AUTO_REPLY_POOL.length)];
      sendChatMessage(reqId, otherRole, reply);
      saveState();
      if (STATE.view === 'chat' && STATE.viewParams.requestId === reqId){
        render();
        var l2 = document.getElementById('chatLog');
        if (l2) l2.scrollTop = l2.scrollHeight;
      }
    }, 1100);
  }
}

    '<textarea class="input" id="feedbackComment" placeholder="Optional comments"></textarea>' +
    '<button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="submitFeedbackAndRender(\''+req.id+'\',\''+role+'\')">Submit feedback</button>' +
  '</div></div>';
}
function setPendingStars(n){ STATE.pendingStars = n; render(); }
function submitFeedbackAndRender(reqId, role){
  var stars = STATE.pendingStars || 0;
  if (!stars){ toast('Please choose a star rating.', 'error'); return; }
  var comment = (document.getElementById('feedbackComment')||{}).value || '';
  submitFeedback(reqId, role, stars, comment);
  STATE.pendingStars = 0;
  saveState();
  toast('Thanks for your feedback.', 'success');
  go(role === 'donor' ? 'donor-dashboard' : 'receiver-dashboard');
}
/* ---------------------------------------------------------------------
   MASTER RENDER
   --------------------------------------------------------------------- */
function render(){
  var content;
  switch(STATE.view){
    case 'landing': content = viewLanding(); break;
    case 'login': content = viewLogin(); break;
    case 'about': content = viewAbout(); break;
    case 'privacy': content = viewPrivacy(); break;
    case 'how-matching': content = viewHowMatching(); break;
    case 'request-new': content = viewRequestNew(); break;
    case 'request-matching': content = viewRequestMatching(); break;
    case 'donor-profile': content = viewDonorProfile(); break;
    case 'receiver-dashboard': content = viewReceiverDashboard(); break;
    case 'donor-dashboard': content = viewDonorDashboard(); break;
    case 'notifications': content = viewNotifications(); break;
    case 'chat': content = viewChat(); break;
    case 'feedback': content = viewFeedback(); break;
    default: content = viewLanding();
  }
  var unread = STATE.notifications.filter(function(n){ return n.unread; }).length;
  var bellBadge = unread ? ' <span style="background:var(--red); color:#fff; border-radius:999px; font-size:10px; padding:1px 6px; margin-left:4px;">' + unread + '</span>' : '';

  document.getElementById('app').innerHTML =
    '<div class="app-shell">' +
      topbar() +
      '<main>' +
        '<div class="container" style="padding-top:18px; padding-bottom:0;">' + demoControlsPanel() + '</div>' +
        content +
      '</main>' +
    '</div>' +
    '<div id="toast-root"></div>';

  // reflect unread badge onto the Notifications nav tab, if present
  var tabs = document.querySelectorAll('.nav-tab');
  tabs.forEach(function(t){
    if (t.textContent.indexOf('Notifications') === 0 && unread){
      t.innerHTML = 'Notifications' + bellBadge;
    }
  });
}

/* ---------------------------------------------------------------------
   PWA: real manifest + icons (linked in <head>), service worker,
   best-effort install prompt
   --------------------------------------------------------------------- */
var deferredInstallPrompt = null;
function registerServiceWorker(){
  try{
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
      navigator.serviceWorker.register('service-worker.js').catch(function(){ /* non-fatal */ });
    }
  }catch(e){ /* service worker unsupported in this environment — non-fatal */ }
}
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
});
function installApp(){
  if (deferredInstallPrompt){
    deferredInstallPrompt.prompt();
  } else {
    toast('This browser/context does not currently support installing the app. Use your browser\u2019s "Add to Home Screen" option if available.', 'error');
  }
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
(function init(){
  registerServiceWorker();
  var saved = loadState();
  STATE = saved || buildInitialState();
  // defensive defaults for older saved shapes
  if (!STATE.matchFilters) STATE.matchFilters = { zone:'', availability:'', minDonations:0 };
  if (STATE.pendingStars == null) STATE.pendingStars = 0;
  STATE.donors.forEach(function(d){ if (!d.redemptions) d.redemptions = []; });
  render();
})();

</script>
</body>
</html>
